# ┌──────────────┬──────────────────────────────────────────────────────────────┐
# │ File         │ .github/workflows/ci.yml                                     │
# │ Purpose      │ Builds and tests the solution on every pull request to a     │
# │              │ shared branch, and after every merge into main or dev.       │
# │              │ A failing run blocks the pull request (see CONTRIBUTING.md). │
# └──────────────┴──────────────────────────────────────────────────────────────┘

name: CI

on:
  pull_request:
    branches: [main, dev, 'release/**']
  push:
    branches: [main, dev]
  workflow_dispatch:

# Read-only token: the workflow never writes to the repository
permissions:
  contents: read

# A new push to the same pull request cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Pull requests only: a pull request adds its changelog fragment and never edits CHANGELOG.md, so that two open pull requests
  # never conflict on it; only docs/release-* merges the fragments (see changelog/unreleased/README.md)
  changelog:
    name: Check the changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The whole history, so that the pull request can be compared with its base
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that CHANGELOG.md is not edited directly
        shell: pwsh
        run: ./.github/scripts/Test-ChangelogUntouched.ps1 -BaseRef "origin/${{ github.base_ref }}" -HeadBranch "${{ github.head_ref }}"

  build:
    name: Build and test
    # Windows: the target platform of the solution
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the .NET SDK pinned in global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The CI solution filter lists every .NET project; the SQL project (MSBuild format) is built in Visual Studio only
      - name: Check that the CI solution filter matches the solution
        run: ./.github/scripts/Test-CISolutionFilter.ps1

      - name: Restore
        run: dotnet restore BoardGamesPlatform.CI.slnf

      - name: Build (warnings are errors)
        run: dotnet build BoardGamesPlatform.CI.slnf --configuration Release --no-restore

      # Rules the build does not enforce: line endings, naming (IDE1006) and the other .editorconfig rules
      - name: Check code style (.editorconfig)
        run: dotnet format BoardGamesPlatform.CI.slnf --verify-no-changes --no-restore

      # After "--", every option applies to each test project: a test project that runs no test fails the run.
      # Each test project writes its TRX report and its Cobertura coverage report (unique file name) to TestResults/;
      # the coverage measures the production code only (test/CodeCoverage.config). No threshold yet.
      - name: Test
        run: >-
          dotnet test --solution BoardGamesPlatform.CI.slnf --configuration Release --no-build
          --results-directory TestResults
          -- --minimum-expected-tests 1
          --report-trx
          --coverage --coverage-output-format cobertura --coverage-settings test/CodeCoverage.config

      # Published even when the tests fail, to read the TRX reports
      - name: Publish the test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: error

  # The SQL project keeps its original MSBuild format, which `dotnet build` cannot build (MSB4278):
  # the Visual Studio MSBuild installed on the runner image is used, with the SSDT targets that ship with it.
  # Separate job: the "Build and test" job stays independent of the Visual Studio installation of the image.
  database:
    name: Build the SQL project
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the SQL project into a DACPAC
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe'
          if (-not $msbuild) { throw 'MSBuild of Visual Studio not found.' }
          & $msbuild src/BoardGamesPlatform.Database/BoardGamesPlatform.Database.sqlproj -p:Configuration=Release -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed (exit code $LASTEXITCODE)." }

      - name: Publish the DACPAC
        uses: actions/upload-artifact@v7
        with:
          name: database-dacpac
          path: src/BoardGamesPlatform.Database/bin/Release/BoardGamesPlatform.Database.dacpac
          if-no-files-found: error

  # Plain PowerShell tests of the script that merges the changelog fragments at release time: a change that breaks it
  # is caught here, before the docs/release-X.Y.Z pull request runs it. Windows: one case of the tests needs it.
  changelog-tools:
    name: Test the changelog tools
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The script exits with 1 when a case fails, which fails the step
      - name: Test the changelog merge script
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/changelog/tests/Test-MergeChangelogFragments.ps1
          if ($LASTEXITCODE -ne 0) { throw "The changelog tests failed (exit code $LASTEXITCODE)." }
